<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>180180 — 180 Flip</title>
<link rel="stylesheet" href="css/base.css">
<style>
  :root{--grid-cols:10;--grid-rows:20}
  body{min-height:100vh}
  .grid-page{min-height:100vh;display:flex;flex-direction:column}
  .grid-header{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(18px,5vw,56px)}
  .grid-header h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em}
  .grid-main{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}
  .grid-frame{padding:14px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(10,10,14,.72);box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .grid{display:grid;grid-template-columns:repeat(10, minmax(22px, 42px));grid-template-rows:repeat(20, minmax(22px, 42px));gap:2px;width:min(430px,82vw);aspect-ratio:1/2;background:rgba(255,255,255,.08);padding:2px}
  .cell{border:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.018)}
  .grid-label{margin:12px 0 0;text-align:center;font-size:10px;letter-spacing:.18em;opacity:.45}
</style>
</head>
<body>
<div class="grid-page">
  <header class="grid-header">
    <a class="back-link" href="index.html">← Back</a>
    <h1>180 FLIP</h1>
    <span aria-hidden="true" style="width:56px"></span>
  </header>
  <main class="grid-main">
    <section aria-label="180 Flip empty game grid">
      <div class="grid-frame">
        <div class="grid" id="grid" aria-label="10 columns by 20 rows"></div>
      </div>
      <p class="grid-label">10 × 20 GRID</p>
    </section>
  </main>
</div>
<script>
  const grid=document.getElementById('grid');
  for(let i=0;i<200;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.setAttribute('aria-hidden','true');
    grid.appendChild(cell);
  }
</script>
</body>
</html>
