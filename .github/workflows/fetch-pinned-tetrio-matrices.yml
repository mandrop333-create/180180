name: Fetch pinned TETR.IO matrix fixture (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact pinned client and extract matrix fixture
        run: node scripts/fetch-tetrio-matrix-fixtures.mjs /tmp/tetrio-matrix-reference-fixtures.js
      - name: Validate generated fixture shape
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const source = fs.readFileSync('/tmp/tetrio-matrix-reference-fixtures.js', 'utf8');
            const required = ['TETRIO_MATRIX_SOURCE', 'TETRIO_MATRIX_REFERENCE'];
            for (const name of required) {
              if (!source.includes(name)) throw new Error('Missing export: ' + name);
            }
            for (const piece of ['I','O','T','S','Z','J','L']) {
              if (!source.includes('\\\"' + piece + '\\\"')) {
                // The generator serializes uppercase piece keys as quoted JSON keys.
                throw new Error('Missing piece in generated fixture: ' + piece);
              }
            }
            console.log('Generated fixture exports and all seven piece keys are present.');
          "
      - name: Upload generated fixture for review
        uses: actions/upload-artifact@v4
        with:
          name: tetrio-pinned-matrix-fixture
          path: /tmp/tetrio-matrix-reference-fixtures.js
          if-no-files-found: error
          retention-days: 14
