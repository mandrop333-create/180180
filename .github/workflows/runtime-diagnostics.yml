name: Runtime diagnostics browser smoke test

on:
  push:
    branches: ["feature/runtime-diagnostics"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  runtime-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm init -y && npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/180180-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/180180-http.log
          exit 1
      - name: Run browser diagnostics test
        run: node --experimental-default-type=module tests/runtime-diagnostics.browser.js
      - name: Upload diagnostics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-report
          path: artifacts/runtime-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
