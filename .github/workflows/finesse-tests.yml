name: Finesse planner regression tests

on:
  push:
    branches: ["main", "fix/finesse-planner-reconciliation"]
    paths:
      - "games/01/finesse.js"
      - "games/01/finesse-rules.js"
      - "games/01/self-test.js"
      - "games/01/engine.js"
      - "games/01/generator.js"
      - "games/01/rules.js"
      - "games/01/state.js"
      - "games/01/renderer.js"
      - "games/01/training-state.js"
      - "games/01/rhythm.js"
      - "games/01/kicks.js"
      - "games/01/rotation.js"
      - "games/01/collision.js"
      - "games/01/pieces.js"
      - ".github/workflows/finesse-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "games/01/finesse.js"
      - "games/01/finesse-rules.js"
      - "games/01/self-test.js"
      - "games/01/engine.js"
      - "games/01/generator.js"
      - "games/01/rules.js"
      - "games/01/state.js"
      - "games/01/renderer.js"
      - "games/01/training-state.js"
      - "games/01/rhythm.js"
      - "games/01/kicks.js"
      - "games/01/rotation.js"
      - "games/01/collision.js"
      - "games/01/pieces.js"
      - ".github/workflows/finesse-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finesse-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Finesse planner regression tests
        run: node --experimental-default-type=module -e "import('./games/01/self-test.js').then(({runTrainerSelfTest}) => console.log(JSON.stringify(runTrainerSelfTest()))).catch(error => { console.error(error); process.exit(1); })"
