name: Finesse independent Playwright route fixtures

on:
  push:
    branches: ["rebuild/finesse-core"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  finesse-browser-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated local game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/180180-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/180180-browser.log
          exit 1
      - name: Run independent finesse route fixtures in Playwright
        env:
          FINESSE_BROWSER_BASE_URL: http://127.0.0.1:4173/
        run: node --experimental-default-type=module games/01/finesse-browser-reference-test.js
